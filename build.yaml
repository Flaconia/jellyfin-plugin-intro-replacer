---
name: "Intro Replacer"
guid: "07e08043-224d-4228-964f-02242635344f"
version: "2.1"
targetAbi: "12.4.0.0"
framework: "net10.0"
owner: "flaconia"
overview: "Play a custom intro before episodes and movies, replacing the original."
description: >
  Intro Replacer plays a per-item custom intro (a local video you provide) before
  an episode or movie, using Jellyfin's server-side intro mechanism so it works on
  any client that supports intros. Rules (matched in order) decide which intro to
  play based on library, tags, genres, studios, dates, users, or specific
  series/season/episode. The item's own detected intro is skipped so the custom
  intro effectively replaces it.
category: "MoviesAndShows"
artifacts:
  - "Jellyfin.Plugin.IntroReplacer.dll"
changelog: >
  Fixes changing the intro folder and the asset buttons on Jellyfin 12.4.
  The folder picker, upload, delete and "use a library video" actions now authenticate
  the way 12.4 requires, so they no longer fail with a 401. A folder that is already
  one of your libraries (for example a Music Videos library) is now used directly,
  stays browsable, and no hidden duplicate library is created over it. This release
  targets Jellyfin 12.4 only; keep the server updated to use the plugin.
