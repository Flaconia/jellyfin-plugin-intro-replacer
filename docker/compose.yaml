name: introreplacer

services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    container_name: introreplacer-jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./media:/media
      # The intro folder can be any container path backed by a host folder you own,
      # e.g. a dedicated folder next to your media (then set the plugin's Intro
      # folder to /media/Intros):
      # - /mnt/media/Intros:/media/Intros
